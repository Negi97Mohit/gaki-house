name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/agent-friendly-cleanup]

jobs:
  checks:
    name: Boundaries, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package boundaries
        run: pnpm boundary-check

      - name: Build monorepo
        run: pnpm build

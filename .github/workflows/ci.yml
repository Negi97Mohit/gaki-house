name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/agent-friendly-cleanup]

jobs:
  checks:
    name: Env, Boundaries, Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check .env.example parity & secrets
        run: pnpm env-check

      - name: Check package boundaries
        run: pnpm boundary-check

      - name: Run type-check, lint, and tests
        run: pnpm check

      - name: Build web and mobile apps
        run: pnpm --filter @gaki/web --filter @gaki/mobile build

      - name: Dead code report (knip)
        continue-on-error: true
        run: pnpm dead-code

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/agent-friendly-cleanup]

env:
  HUSKY: "0"

jobs:
  checks:
    name: Env, Boundaries, Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check .env.example parity & secrets
        run: pnpm env-check

      - name: Check package boundaries
        run: pnpm boundary-check

      - name: Run type-check, lint, and tests
        run: pnpm check

      - name: Build web and mobile apps
        env:
          VITE_FIREBASE_API_KEY: "ci-placeholder-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "ci-placeholder"
          VITE_FIREBASE_STORAGE_BUCKET: "ci-placeholder.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:000000000000"
        run: pnpm --filter @gaki/web --filter @gaki/mobile build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: pnpm test:e2e

      - name: Dead code check (knip)
        run: pnpm dead-code

      - name: Dead code advisory (unused exports & types)
        continue-on-error: true
        run: pnpm dead-code:advisory
